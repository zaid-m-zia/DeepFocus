<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <!-- Outer Focus Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#312e81" stroke-width="8" stroke-dasharray="16 12" />
  <!-- Active Arc -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#ringGrad)" stroke-width="12" stroke-linecap="round" stroke-dasharray="480 520" filter="url(#glow)" />
  <!-- Mid Target Ring -->
  <circle cx="256" cy="256" r="105" fill="none" stroke="#6366f1" stroke-width="10" stroke-opacity="0.5" />
  <!-- Inner Core -->
  <circle cx="256" cy="256" r="50" fill="url(#ringGrad)" filter="url(#glow)" />
  <!-- Center Pin / Spark -->
  <circle cx="256" cy="256" r="18" fill="#ffffff" />
</svg>
