<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>DeepFocus</title>
    <meta name="description" content="A distraction-free, editorial study-focus Progressive Web App with tabular numeral timer, zero visual noise, multi-palette theme engine, anonymous Firebase cloud backup, and task manager." />
    <meta property="og:title" content="DeepFocus" />
    <meta property="og:description" content="A distraction-free, editorial study-focus Progressive Web App with tabular numeral timer, zero visual noise, multi-palette theme engine, anonymous Firebase cloud backup, and task manager." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- PWA & Mobile Web App Meta Tags -->
    <meta name="theme-color" content="#f4f0ea" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DeepFocus" />
    <meta name="application-name" content="DeepFocus" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- Google Fonts: Space Grotesk (Editorial Sans) & Space Mono (Tabular numerals & labels) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <!-- App Icons -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body class="antialiased select-none overflow-x-hidden transition-colors duration-150" style="background-color: var(--bg); color: var(--text);">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
